name: Update profile art
"on":
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      # Re-enable ourselves every run: GitHub disables scheduled workflows in
      # public repos after 60 days without repository activity.
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-profile-art.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
